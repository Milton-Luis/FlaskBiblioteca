{% extends "layout.html" %}

{% block content %}
<div class="login-block">
  

    <div class="login">
        <form class="login-form" action="{{ url_for('auth.login') }}" method="POST">
            {{ form.hidden_tag() }}
            <div class="mb-4">
                <div class="input-group">
                    <span class="input-group-text fas fa-at py-3"></span>
                    {{ form.email(class="form-control") }}
                </div>
            </div>

            <div class="mb-4">
                <div class="input-group">
                    <span class="input-group-text fas fa-unlock py-3" id="lockUnlock"></span>
                    {{ form.password(type="password", class="form-control password") }}
                </div>
            </div>

            <div class="col-auto">
                {{ form.submit(class="btn btn-primary") }}
            </div>
        </form>
    </div>
</div>
{% endblock content %}
